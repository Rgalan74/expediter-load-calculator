    header { position: relative; top: 0; margin-top: 0; z-index: 1000; padding: 1.25rem 0; background: transparent; }

    .tab-btn:hover { background: rgba(255,255,255,0.05); border-color: var(--primary-cyan); }

            <input type="hidden" id="reg-language" value="en">

            <span style="font-size:1.25rem;flex-shrink:0;">🎁</span>

            class="bg-green-600 text-white px-4 py-3 w-full rounded-lg hover:bg-green-700 font-semibold transition duration-300">

      <!-- Status message -->

  <!-- GA4 tracking for registration events on this page -->

  <script>
    // i18n helper — safe to call before or after init
    function t(key, params) {
      return window.i18n?.t(key, params || {}) || key;
    }

    function showMessage(message, type) {
      type = type || "info";
      const authMessage = document.getElementById("authMessage");
      if (!authMessage) { debugLog(message); return; }
      authMessage.className = "text-center text-sm mt-4";
      if (type === "success") authMessage.className += " text-green-600";
      else if (type === "error") authMessage.className += " text-red-600";
      else authMessage.className += " text-blue-600";
      authMessage.textContent = message;
      authMessage.classList.remove("hidden");
      setTimeout(() => { authMessage.classList.add("hidden"); }, 5000);
    }

    function hideMessage() {
      const authMessage = document.getElementById("authMessage");
      if (authMessage) authMessage.classList.add("hidden");
    }

    document.addEventListener("DOMContentLoaded", () => {
      // Language toggle active state
      if (window.i18n) {
        window.i18n.init();
        const active = 'color:#1d4ed8;font-weight:800;', inactive = 'color:#9ca3af;font-weight:700;';
        function updateLangBtns(lang) {
          const isEs = lang === 'es';
          const enBtn = document.getElementById('btn-en');
          const esBtn = document.getElementById('btn-es');
          if (enBtn) { enBtn.style.color = isEs ? '#9ca3af' : '#1d4ed8'; enBtn.style.fontWeight = isEs ? '700' : '800'; }
          if (esBtn) { esBtn.style.color = isEs ? '#1d4ed8' : '#9ca3af'; esBtn.style.fontWeight = isEs ? '800' : '700'; }
        }
        updateLangBtns(window.i18n.currentLang || 'en');
        document.addEventListener('languageChanged', (e) => updateLangBtns(e.detail.lang));
      }

      const loginForm = document.getElementById("loginForm");
      const registerForm = document.getElementById("registerForm");
      const loginPanel = document.getElementById("loginPanel");
      const registerPanel = document.getElementById("registerPanel");
      const tabLogin = document.getElementById("tabLogin");
      const tabRegister = document.getElementById("tabRegister");

      debugLog("🚀 Auth page loaded");

      firebase.auth().onAuthStateChanged((user) => {
        // Durante el registro no redirigir: handleRegisterSubmit redirige al terminar de guardar
        if (user && !window._slsRegistering) {
          debugLog("✅ User already authenticated:", user.email);
          const hasPendingPlan = localStorage.getItem('pendingPlan');
          if (hasPendingPlan) {
            showMessage(t('auth.msg_session_active'), "success");
            setTimeout(() => { redirectAfterAuth(); }, 500);
          } else {
            showMessage(t('auth.msg_session_user', { email: user.email }), "success");
            setTimeout(() => { redirectAfterAuth(); }, 1500);
          }
        }
      });

      async function handleLoginSubmit(form) {
        const email = form.email.value.trim();
        const password = form.password.value.trim();
        debugLog("🔑 Attempting login for:", email);
        if (!email || !password) {
          showMessage(t('auth.error_required'), "error");
          return;
        }
        try {
          showMessage(t('auth.logging_in'), "info");
          const userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);
          debugLog("✅ Login successful:", userCredential.user.email);
          showMessage(t('auth.login_success'), "success");
          setTimeout(() => { redirectAfterAuth(); }, 1500);
        } catch (error) {
          debugLog("❌ Error en login:", error);
          showMessage("❌ " + formatFirebaseError(error), "error");
        }
      }

      async function handleRegisterSubmit(form) {
        const fullName = form.fullName.value.trim();
        const email = form.email.value.trim();
        const password = form.password.value.trim();
        const phone = form.phone ? form.phone.value.trim() : '';
        debugLog("📝 Attempting registration for:", email);
        if (!fullName || !email || !password) {
          showMessage(t('auth.error_name_email_password'), "error");
          return;
        }
        if (password.length < 6) {
          showMessage(t('auth.error_min_password'), "error");
          return;
        }
        try {
          showMessage(t('auth.registering'), "info");
          window._slsRegistering = true;
          const userCred = await firebase.auth().createUserWithEmailAndPassword(email, password);
          debugLog("✅ Registration successful:", userCred.user.email);

          if (typeof window.initializeUserPlan === 'function') {
            await window.initializeUserPlan(userCred.user.uid, email);
          }
          // ✅ FASE 3: Save preferred language on account creation
          const selectedLang = document.getElementById('reg-language')?.value || window.i18n?.currentLang || 'en';
          await firebase.firestore().collection("users").doc(userCred.user.uid).set({
            fullName,
            email,
            phone: phone || '',
            preferredLanguage: selectedLang,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });
          // Apply the chosen language immediately
          if (window.i18n) window.i18n.setLanguage(selectedLang);

          // Tips por email (opcional): guardar la preferencia y, si aceptó, añadir a la lista de Brevo
          const quiereTips = !!(form.marketingOptIn && form.marketingOptIn.checked);
          try {
            await firebase.firestore().collection('users').doc(userCred.user.uid).set({ marketingConsent: quiereTips }, { merge: true });
            if (quiereTips) {
              await firebase.app().functions('us-central1').httpsCallable('subscribeLead')({
                name: fullName, email: email, lang: selectedLang, landing_page: '/auth.html', utm_source: 'registro'
              });
            }
          } catch (e) { debugLog('[auth] Preferencia de tips no guardada:', e.message); }

          // Bienvenida: la arma y la envía el servidor, una sola vez por cuenta
          try {
            await firebase.app().functions('us-central1').httpsCallable('sendWelcomeEmail')({ lang: selectedLang });
          } catch (e) { debugLog('[auth] Email de bienvenida no enviado:', e.message); }

          debugLog("✅ User profile saved");
          showMessage(t('auth.register_success'), "success");

          // GA4/Firebase Analytics must be initialized on auth.html before sending sign_up.
          if (window.analyticsManager) {
            await window.analyticsManager.init();
            window.analyticsManager.trackEvent("sign_up", { method: "email" });
          } else if (typeof gtag === "function") {
            gtag("event", "sign_up", { method: "email" });
          }

          // ✅ Meta Pixel — registro exitoso
          trackMeta("CompleteRegistration", { method: "email", value: 1.00, currency: "USD" });

          // ✅ Meta Pixel — el registro siempre activa los 14 dias de prueba de Lex AI
          trackMeta("StartTrial", { method: "email" });

          setTimeout(() => { redirectAfterAuth(); }, 2500);
          return;
        } catch (error) {
          debugLog("❌ Error en registro:", error);
          window._slsRegistering = false;
          showMessage("❌ " + formatFirebaseError(error), "error");
          // Si la cuenta se creo pero fallo un paso posterior, entrar igualmente a la app
          if (firebase.auth().currentUser) setTimeout(() => { redirectAfterAuth(); }, 2500);
        }
      }

      function setActiveAuthTab(tab) {
        const isLogin = tab === "login";
        loginPanel.classList.toggle("hidden", !isLogin);
        registerPanel.classList.toggle("hidden", isLogin);
        tabLogin.classList.toggle("active", isLogin);
        tabRegister.classList.toggle("active", !isLogin);
        hideMessage();
        if (loginForm) loginForm.reset();
        if (registerForm) registerForm.reset();
      }

      function formatFirebaseError(error) {
        if (!error || !error.code) return error?.message || t('auth.error_unknown');
        switch (error.code) {
          case "auth/email-already-in-use":    return t('auth.error_email_in_use');
          case "auth/invalid-email":           return t('auth.error_invalid_email');
          case "auth/weak-password":           return t('auth.error_weak_password');
          case "auth/user-not-found":          return t('auth.error_user_not_found');
          case "auth/wrong-password":          return t('auth.error_wrong_password');
          case "auth/invalid-credential":
          case "auth/invalid-login-credentials": return t('auth.error_invalid_credential');
          case "auth/too-many-requests":       return t('auth.error_too_many_requests');
          case "auth/network-request-failed":  return t('auth.error_network');
          default:                             return t('auth.error_unknown');
        }
      }

      async function handlePasswordReset() {
        const emailInput = loginForm?.querySelector('input[name="email"]');
        const email = emailInput?.value?.trim();
        if (!email) {
          showMessage(t('auth.err_enter_email'), "error");
          emailInput?.focus();
          return;
        }
        try {
          showMessage(t('auth.msg_reset_sending'), "info");
          await firebase.auth().sendPasswordResetEmail(email);
          showMessage(t('auth.msg_reset_ok', { email }), "success");
        } catch (error) {
          debugLog("❌ Error en password reset:", error);
          showMessage("❌ " + formatFirebaseError(error), "error");
        }
      }

      if (loginForm) {
        loginForm.addEventListener("submit", (e) => { e.preventDefault(); handleLoginSubmit(e.target); });
      }

      const forgotLink = document.getElementById('forgotPasswordLink');
      if (forgotLink) {
        forgotLink.addEventListener('click', (e) => { e.preventDefault(); handlePasswordReset(); });
      }

      if (registerForm) {
        registerForm.addEventListener("submit", (e) => { e.preventDefault(); handleRegisterSubmit(e.target); });
      }

      if (tabLogin) tabLogin.addEventListener("click", () => setActiveAuthTab("login"));
      if (tabRegister) {
        tabRegister.addEventListener("click", () => {
          trackMeta("Lead", { source: "auth_tab_register" });
          setActiveAuthTab("register");
        });
      }

      const tabFromUrl = new URLSearchParams(window.location.search).get("tab");
      setActiveAuthTab(tabFromUrl === "register" ? "register" : "login");

      // Prellenar el registro con el nombre/email que el visitante ya dejo en
      // el modal de lead de la landing (se guarda en sessionStorage, no en la URL).
      try {
        const rawPrefill = sessionStorage.getItem('slsLeadPrefill');
        if (rawPrefill) {
          sessionStorage.removeItem('slsLeadPrefill');
          const prefill = JSON.parse(rawPrefill);
          const regForm = document.getElementById('registerForm');
          if (regForm && prefill) {
            if (prefill.name && !regForm.fullName.value) regForm.fullName.value = String(prefill.name).slice(0, 100);
            if (prefill.email && !regForm.email.value) regForm.email.value = String(prefill.email).slice(0, 200);
            if (regForm.email.value) regForm.password.focus();
          }
        }
      } catch (_) { /* prefill es opcional */ }

      debugLog("✅ Auth page setup complete");
    });

    // ✅ FASE 3: Language selector helper
    window.selectRegLang = function(lang) {
      window.marcarRegLang(lang);
      // Also update the UI language preview immediately
      if (window.i18n) window.i18n.setLanguage(lang);
    };
    // Solo marca el botón (sin cambiar el idioma de la página)
    window.marcarRegLang = function(lang) {
      const hiddenInput = document.getElementById('reg-language');
      const btnEn = document.getElementById('reg-lang-en');
      const btnEs = document.getElementById('reg-lang-es');
      if (hiddenInput) hiddenInput.value = lang;
      if (lang === 'en') {
        if (btnEn) { btnEn.style.borderColor='#3b82f6'; btnEn.style.background='#eff6ff'; btnEn.style.color='#1d4ed8'; }
        if (btnEs) { btnEs.style.borderColor='#d1d5db'; btnEs.style.background='white'; btnEs.style.color='#6b7280'; }
      } else {
        if (btnEs) { btnEs.style.borderColor='#3b82f6'; btnEs.style.background='#eff6ff'; btnEs.style.color='#1d4ed8'; }
        if (btnEn) { btnEn.style.borderColor='#d1d5db'; btnEn.style.background='white'; btnEn.style.color='#6b7280'; }
      }
      // Clase para el estilo nuevo (css/sls-pages.css)
      if (btnEn) btnEn.classList.toggle('sls-on', lang === 'en');
      if (btnEs) btnEs.classList.toggle('sls-on', lang === 'es');
    };
    // El selector sigue al idioma real de la página: al cargar (i18nReady) y al cambiarlo con EN | ES
    document.addEventListener('i18nReady', (e) => window.marcarRegLang(e.detail?.lang === 'es' ? 'es' : 'en'));
    document.addEventListener('languageChanged', (e) => window.marcarRegLang(e.detail?.lang === 'es' ? 'es' : 'en'));


    let _redirecting = false;

    async function redirectAfterAuth() {
      if (_redirecting) return;
      _redirecting = true;

      const pendingPlan = localStorage.getItem('pendingPlan');
      debugLog('🔵 redirectAfterAuth, pendingPlan:', pendingPlan);

      if (pendingPlan) {
        localStorage.removeItem('pendingPlan');
        const checkReady = setInterval(() => {
          const user = firebase.auth().currentUser;
          if (user && window.StripeIntegration) {
            clearInterval(checkReady);
            debugLog('🔵 Iniciando checkout para:', pendingPlan);
            window.StripeIntegration.createCheckoutSession(pendingPlan)
              .catch(err => {
                debugLog('❌ Checkout error:', err);
                window.location.href = 'app.html';
              });
          }
        }, 500);
        setTimeout(() => {
          clearInterval(checkReady);
          if (!window.StripeIntegration || !firebase.auth().currentUser) {
            debugLog('❌ Timeout esperando Stripe/Auth');
            localStorage.setItem('pendingPlan', pendingPlan);
            window.location.href = 'app.html';
          }
        }, 10000);
      } else {
        window.location.href = 'app.html';
      }
    }
  </script>

  <script src="/js/cookie-consent.js?v=1.2.0"></script>
