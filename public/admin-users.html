<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Control — SmartLoad Solution</title>
    <meta name="robots" content="noindex, nofollow" />

    <!-- Tus estilos del design system -->
    <link rel="stylesheet" href="./css/design-system.css">
    <link rel="stylesheet" href="./css/theme-tokens.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0b1020;
            --bg-2: #131a2e;
            --glass: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text: #e6ecff;
            --muted: #93a0c0;
            --purple: #8b5cf6;
            --green: #22c55e;
            --amber: #f59e0b;
            --red: #ef4444;
            --blue: #3b82f6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
            background: radial-gradient(1200px 600px at 80% -10%, #1b2550 0%, var(--bg) 55%);
            color: var(--text);
            min-height: 100vh;
            padding: 24px;
        }

        .wrap { max-width: 1280px; margin: 0 auto; }

        header.top {
            display: flex; align-items: center; justify-content: space-between;
            gap: 16px; margin-bottom: 20px; flex-wrap: wrap;
        }
        header.top h1 { font-size: 1.6rem; display: flex; align-items: center; gap: 10px; }
        .sub { color: var(--muted); font-size: .9rem; }

        .toolbar {
            display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
            background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: 14px; padding: 14px 16px; margin-bottom: 18px;
            backdrop-filter: blur(8px);
        }
        .toolbar input, .toolbar select {
            background: rgba(0,0,0,.25); border: 1px solid var(--glass-border);
            color: var(--text); padding: 10px 12px; border-radius: 10px; font-size: .9rem;
            outline: none;
        }
        .toolbar input[type="text"] { flex: 1; min-width: 220px; }
        .toolbar input[type="date"] { width: 150px; color-scheme: dark; }
        .toolbar select { width: auto; min-width: 150px; }
        .toolbar input:focus, .toolbar select:focus { border-color: var(--purple); }

        .btn {
            border: none; border-radius: 10px; padding: 10px 16px; font-weight: 600;
            cursor: pointer; font-size: .9rem; transition: transform .12s, filter .12s;
        }
        .btn:hover { transform: translateY(-1px); filter: brightness(1.08); }
        .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
        .btn-primary { background: linear-gradient(135deg, var(--purple), var(--blue)); color: #fff; }
        .btn-ghost { background: var(--glass); border: 1px solid var(--glass-border); color: var(--text); }
        .btn-green { background: var(--green); color: #04210f; }
        .btn-red { background: var(--red); color: #fff; }
        .btn-amber { background: var(--amber); color: #2a1a00; }

        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 12px; margin-bottom: 18px; }
        .stat {
            background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: 14px; padding: 16px; backdrop-filter: blur(8px);
        }
        .stat .label { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; }
        .stat .value { font-size: 1.7rem; font-weight: 800; margin-top: 4px; }

        .table-card {
            background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: 16px; overflow: hidden; backdrop-filter: blur(8px);
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 14px; text-align: left; font-size: .88rem; }
        thead th {
            color: var(--muted); font-size: .72rem; text-transform: uppercase;
            letter-spacing: .05em; border-bottom: 1px solid var(--glass-border);
            position: sticky; top: 0; background: var(--bg-2);
        }
        thead th.sortable { cursor: pointer; user-select: none; }
        thead th.sortable:hover { color: var(--text); }
        tbody tr { border-bottom: 1px solid rgba(255,255,255,.05); cursor: pointer; }
        tbody tr:hover { background: rgba(139,92,246,.10); }
        tbody tr:last-child { border-bottom: none; }
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .8rem; color: var(--muted); }

        .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .72rem; font-weight: 700; }
        .pill-free { background: #334155; color: #cbd5e1; }
        .pill-starter { background: #1e3a8a; color: #bfdbfe; }
        .pill-professional { background: #155e75; color: #a5f3fc; }
        .pill-premium { background: linear-gradient(135deg,#7c3aed,#db2777); color: #fff; }
        .pill-status-active { background: rgba(34,197,94,.18); color: #4ade80; }
        .pill-status-suspended { background: rgba(239,68,68,.18); color: #f87171; }
        .pill-status-none { background: rgba(148,163,184,.18); color: #cbd5e1; }
        .pill-status-canceled { background: rgba(245,158,11,.18); color: #fbbf24; }
        .pill-status-canceled_scheduled { background: rgba(245,158,11,.18); color: #fbbf24; }

        /* Billing overview (lista principal) */
        .billing-section { margin-bottom: 18px; }
        .billing-section .billing-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; flex-wrap: wrap; gap: 10px;
        }
        .billing-section .billing-header h2 { font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
        .period-toggle { display: inline-flex; background: rgba(0,0,0,.3); border-radius: 8px; padding: 2px; font-size: .78rem; }
        .period-toggle span { padding: 5px 14px; border-radius: 6px; color: var(--muted); cursor: pointer; user-select: none; }
        .period-toggle span.active { background: var(--purple); color: #fff; }
        .billing-charts { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; margin-top: 14px; }
        .billing-charts .card {
            background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: 14px; padding: 16px; backdrop-filter: blur(8px);
            height: 260px; display: flex; flex-direction: column;
        }
        .billing-charts .card h4 { font-size: .72rem; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; letter-spacing: .05em; }
        .billing-charts .card > div { position: relative; flex: 1; min-height: 0; }
        @media (max-width: 860px) { .billing-charts { grid-template-columns: 1fr; } }

        /* Detail page */
        .detail-card {
            background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 20px 24px; margin-bottom: 16px;
            backdrop-filter: blur(8px);
        }
        .detail-card h2 { font-size: 1.4rem; }
        .back-link {
            display: inline-flex; align-items: center; gap: 6px; color: var(--muted);
            text-decoration: none; font-size: .88rem; margin-bottom: 16px; cursor: pointer;
        }
        .back-link:hover { color: var(--text); }
        .alert-line {
            background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.35);
            color: #fbbf24; border-radius: 10px; padding: 10px 14px; font-size: .85rem;
            margin-top: 14px;
        }
        .loads-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .loads-table th, .loads-table td {
            padding: 8px 10px; text-align: left; font-size: .82rem;
            border-bottom: 1px solid rgba(255,255,255,.05);
        }
        .loads-table th { color: var(--muted); font-size: .7rem; text-transform: uppercase; }
        .section { margin-top: 22px; }
        .section h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 10px; border-bottom: 1px solid var(--glass-border); padding-bottom: 6px; }
        .kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; font-size: .86rem; }
        .kv .k { color: var(--muted); }
        .row-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        textarea, .detail-card select, .detail-card input {
            width: 100%; background: rgba(0,0,0,.25); border: 1px solid var(--glass-border);
            color: var(--text); border-radius: 10px; padding: 10px; font-size: .88rem; outline: none;
        }
        textarea { min-height: 80px; resize: vertical; }
        .detail-card select:focus, .detail-card input:focus, textarea:focus { border-color: var(--purple); }
        .pay { background: rgba(0,0,0,.2); border: 1px solid var(--glass-border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; font-size: .82rem; }
        .muted { color: var(--muted); }
        .empty { text-align: center; color: var(--muted); padding: 40px; }
        .toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: #111827; border: 1px solid var(--glass-border); color: #fff;
            padding: 12px 18px; border-radius: 12px; font-size: .9rem; z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,.4); opacity: 0; transition: opacity .2s;
        }
        .toast.show { opacity: 1; }
        .toast.err { border-color: var(--red); }
        .toast.ok { border-color: var(--green); }
        .hidden { display: none !important; }
        .small-note { font-size: .76rem; color: var(--muted); margin-top: 6px; }
        a.stripe-link { color: var(--blue); text-decoration: underline; }
    </style>

    <script>
        // helpers mínimos (no dependemos de helpers.js completo)
        function debugLog(...a) { if (window.console) console.log('[admin-users]', ...a); }
        let _toastEl;
        function showToast(msg, type) {
            if (!_toastEl) { _toastEl = document.getElementById('toast'); }
            if (!_toastEl) return;
            _toastEl.textContent = msg;
            _toastEl.className = 'toast show ' + (type || '');
            setTimeout(() => { _toastEl.className = 'toast ' + (type || ''); }, 3000);
        }
    </script>
</head>

<body>
    <div class="wrap">
        <header class="top">
            <div>
                <h1>👑 User Control</h1>
                <div class="sub">Control total de usuarios, planes, suscripciones y pagos — SmartLoad Solution</div>
            </div>
            <div>
                <span id="whoami" class="muted mono"></span>
                <button class="btn btn-ghost" onclick="logout()" style="margin-left:10px">Salir</button>
            </div>
        </header>

        <div id="gate" class="empty hidden">Verificando acceso…</div>

        <div id="app" class="hidden">
            <div class="toolbar">
                <input type="text" id="search" placeholder="🔍 Buscar por email o UID…" oninput="renderTable()">
                <select id="fPlan" onchange="renderTable()">
                    <option value="all">Todos los planes</option>
                    <option value="free">Free</option>
                    <option value="starter">Starter</option>
                    <option value="professional">Professional</option>
                    <option value="premium">Premium</option>
                </select>
                <select id="fStatus" onchange="renderTable()">
                    <option value="all">Todos los estados</option>
                    <option value="active">Activo</option>
                    <option value="suspended">Suspendido</option>
                </select>
                <select id="fRole" onchange="renderTable()">
                    <option value="all">Todos los roles</option>
                    <option value="admin">Admin</option>
                    <option value="developer">Developer</option>
                    <option value="user">User</option>
                </select>
                <select id="fSub" onchange="renderTable()">
                    <option value="all">Toda suscripción</option>
                    <option value="active">Activa</option>
                    <option value="none">Sin suscripción</option>
                    <option value="canceled">Cancelada</option>
                    <option value="canceled_scheduled">Cancela pronto</option>
                </select>
                <input type="date" id="fDateFrom" onchange="renderTable()" title="Registrado desde">
                <input type="date" id="fDateTo" onchange="renderTable()" title="Registrado hasta">
                <button class="btn btn-primary" onclick="refreshUsers()">🔄 Recargar</button>
            </div>

            <div class="stats" id="stats"></div>

            <div id="billingOverview" class="billing-section hidden">
                <div class="billing-header">
                    <h2>💳 Facturación</h2>
                    <div class="period-toggle">
                        <span id="periodMonthBtn" class="active" onclick="setBillingPeriod('month')">Mes</span>
                        <span id="periodYearBtn" onclick="setBillingPeriod('year')">Año</span>
                    </div>
                </div>
                <div class="stats">
                    <div class="stat"><div class="label">Ingresos totales</div><div class="value" id="billTotalRevenue">—</div></div>
                    <div class="stat"><div class="label">MRR actual</div><div class="value" id="billMrr">—</div></div>
                    <div class="stat"><div class="label">Este mes</div><div class="value" id="billThisMonth">—</div></div>
                    <div class="stat"><div class="label">Pagos con problema</div><div class="value" id="billFailed">—</div></div>
                </div>
                <div class="billing-charts">
                    <div class="card">
                        <h4>Ingresos por período</h4>
                        <div><canvas id="revenueChart"></canvas></div>
                    </div>
                    <div class="card">
                        <h4>Distribución por plan</h4>
                        <div><canvas id="planChart"></canvas></div>
                    </div>
                </div>
            </div>

            <div class="table-card">
                <table>
                    <thead>
                        <tr>
                            <th class="sortable" onclick="setSort('email')">Usuario<span id="sortInd_email"></span></th>
                            <th class="sortable" onclick="setSort('plan')">Plan<span id="sortInd_plan"></span></th>
                            <th class="sortable" onclick="setSort('subscriptionStatus')">Suscripción<span id="sortInd_subscriptionStatus"></span></th>
                            <th class="sortable" onclick="setSort('accountStatus')">Cuenta<span id="sortInd_accountStatus"></span></th>
                            <th class="sortable" onclick="setSort('createdAt')">Registro<span id="sortInd_createdAt"></span></th>
                        </tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Vista de detalle de usuario (pagina completa, no drawer) -->
    <div id="detailView" class="hidden wrap" style="margin-top:0"></div>

    <div id="toast" class="toast"></div>

    <!-- Firebase (mismos scripts que el resto de la app) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-functions-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <script src="./js/config.js"></script>
    <script src="./js/core/roles-manager.js"></script>

    <script>
        // --- Modo mock: ?mock=1 sirve todo desde admin-mock-server.js, sin
        // tocar Firebase/Stripe real (ni siquiera se inicializa el SDK).
        const MOCK_MODE = new URLSearchParams(location.search).get('mock') === '1';

        // --- Init Firebase (reutiliza config.js) ---
        // config.js (cargado arriba) es quien llama a firebase.initializeApp() con la
        // config real, dentro de su propio listener DOMContentLoaded — todavía no ha
        // corrido cuando este <script> se ejecuta. NO reinicializar aquí: llamar
        // firebase.initializeApp() por segunda vez con opciones vacías revienta con
        // "Firebase: Need to provide options (app/no-options)" y aborta el resto de
        // este script, dejando la página solo con el header estático. En vez de eso,
        // esperamos a que config.js termine (mismo patrón que setup-admin.html).
        var auth, db, functions;

        let ALL_USERS = [];
        let routingInitialized = false;
        let BILLING_DATA = null;
        let billingPeriod = 'month';
        let revenueChart = null;
        let planChart = null;
        let billingRequestId = 0;
        let sortField = 'createdAt';
        let sortDir = 'desc';
        const SORT_FIELDS = ['email', 'plan', 'subscriptionStatus', 'accountStatus', 'createdAt'];
        // Inspirados en los colores de .pill-* (mismo orden de tonos: gris, azul,
        // cyan, magenta/purpura) pero mas saturados -- los fondos reales de las
        // pills son oscuros y quedan planos/dificiles de distinguir como
        // segmentos solidos de una dona sobre el mismo fondo oscuro de la pagina.
        const PLAN_CHART_COLORS = { free: '#64748b', starter: '#3b82f6', professional: '#22d3ee', premium: '#db2777' };

        function waitForFirebaseReady(cb) {
            if (window.auth && window.db) { cb(); return; }
            setTimeout(() => waitForFirebaseReady(cb), 200);
        }

        if (MOCK_MODE) {
            document.getElementById('whoami').textContent = 'admin@smartload.com (MOCK)';
            document.getElementById('gate').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            initRouting();
        } else {
            waitForFirebaseReady(() => {
                auth = window.auth;
                db = window.db;
                functions = firebase.app().functions('us-central1');

                auth.onAuthStateChanged(async (user) => {
                    const gate = document.getElementById('gate');
                    gate.classList.remove('hidden');
                    if (!user) {
                        gate.textContent = '🔒 Debes iniciar sesión como admin.';
                        setTimeout(() => { window.location.href = './auth.html?redirect=admin-users.html'; }, 1500);
                        return;
                    }
                    // Verificar rol admin
                    try {
                        const snap = await db.collection('users').doc(user.uid).get();
                        const role = snap.exists ? (snap.data().role || 'user') : 'user';
                        if (role !== 'admin') {
                            gate.textContent = '🚫 No tienes permisos de administrador.';
                            return;
                        }
                        document.getElementById('whoami').textContent = user.email;
                        gate.classList.add('hidden');
                        document.getElementById('app').classList.remove('hidden');
                        initRouting();
                    } catch (e) {
                        gate.textContent = 'Error verificando permisos: ' + e.message;
                    }
                });
            });
        }

        function initRouting() {
            if (!routingInitialized) {
                routingInitialized = true;
                window.addEventListener('popstate', renderFromUrl);
            }
            renderFromUrl();
        }

        function renderFromUrl() {
            const uid = new URLSearchParams(location.search).get('uid');
            if (uid) {
                showDetailView(uid);
            } else {
                showListView();
            }
        }

        function showListView() {
            document.getElementById('detailView').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            refreshUsers();
            renderBillingOverview();
        }

        function showDetailView(uid) {
            document.getElementById('app').classList.add('hidden');
            const dv = document.getElementById('detailView');
            dv.classList.remove('hidden');
            dv.innerHTML = '<div class="empty">Cargando…</div>';
            loadUserDetail(uid);
        }

        function goToUser(uid) {
            const qs = MOCK_MODE ? ('?uid=' + uid + '&mock=1') : ('?uid=' + uid);
            history.pushState({}, '', qs);
            showDetailView(uid);
        }

        function backToList() {
            const qs = MOCK_MODE ? '?mock=1' : '';
            history.pushState({}, '', location.pathname + qs);
            showListView();
        }

        function cf(name) {
            if (MOCK_MODE) {
                return async (payload) => {
                    const res = await fetch('/__mock/' + name, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ data: payload || {} }),
                    });
                    const json = await res.json();
                    if (json.error) {
                        const err = new Error(json.error.message);
                        err.code = json.error.code;
                        throw err;
                    }
                    return { data: json.data };
                };
            }
            return firebase.app().functions('us-central1').httpsCallable(name);
        }

        async function refreshUsers() {
            try {
                showToast('Cargando usuarios…');
                const res = await cf('adminGetUsers')();
                ALL_USERS = res.data.users || [];
                renderTable();
                if (BILLING_DATA) renderPlanDistributionChart();
                showToast('✅ ' + ALL_USERS.length + ' usuarios', 'ok');
            } catch (e) {
                showToast('❌ ' + (e.message || e), 'err');
            }
        }

        function renderStats(list) {
            const total = list.length;
            const byPlan = { free:0, starter:0, professional:0, premium:0 };
            let active = 0, suspended = 0;
            list.forEach(u => {
                if (byPlan[u.plan] !== undefined) byPlan[u.plan]++;
                if (u.accountStatus === 'suspended') suspended++; else active++;
            });
            const el = document.getElementById('stats');
            el.innerHTML = `
                <div class="stat"><div class="label">Total</div><div class="value">${total}</div></div>
                <div class="stat"><div class="label">Free</div><div class="value">${byPlan.free}</div></div>
                <div class="stat"><div class="label">Professional</div><div class="value">${byPlan.professional}</div></div>
                <div class="stat"><div class="label">Premium</div><div class="value">${byPlan.premium}</div></div>
                <div class="stat"><div class="label">Activos</div><div class="value">${active}</div></div>
                <div class="stat"><div class="label">Suspendidos</div><div class="value">${suspended}</div></div>
            `;
        }

        function planPill(p) {
            const map = { free:'pill-free', starter:'pill-starter', professional:'pill-professional', premium:'pill-premium' };
            return `<span class="pill ${map[p]||'pill-free'}">${escapeHtml((p||'free').toUpperCase())}</span>`;
        }
        function statusPill(s) {
            const map = { active:'pill-status-active', suspended:'pill-status-suspended', none:'pill-status-none', canceled:'pill-status-canceled', canceled_scheduled:'pill-status-canceled_scheduled' };
            return `<span class="pill ${map[s]||'pill-status-none'}">${escapeHtml((s||'none').toUpperCase())}</span>`;
        }
        function fmt(d) {
            if (!d) return '—';
            try { return new Date(d).toLocaleString(); } catch { return d; }
        }

        function setSort(field) {
            if (sortField === field) {
                sortDir = sortDir === 'asc' ? 'desc' : 'asc';
            } else {
                sortField = field;
                sortDir = field === 'createdAt' ? 'desc' : 'asc';
            }
            renderTable();
        }

        function updateSortIndicators() {
            SORT_FIELDS.forEach(f => {
                const el = document.getElementById('sortInd_' + f);
                if (!el) return;
                el.textContent = f === sortField ? (sortDir === 'asc' ? ' ▲' : ' ▼') : '';
            });
        }

        function renderTable() {
            const q = document.getElementById('search').value.toLowerCase();
            const fp = document.getElementById('fPlan').value;
            const fs = document.getElementById('fStatus').value;
            const fr = document.getElementById('fRole').value;
            const fsub = document.getElementById('fSub').value;
            const fFrom = document.getElementById('fDateFrom').value;
            const fTo = document.getElementById('fDateTo').value;
            const rows = ALL_USERS.filter(u => {
                const mq = !q || (u.email||'').toLowerCase().includes(q) || (u.uid||'').toLowerCase().includes(q);
                const mp = fp === 'all' || u.plan === fp;
                const ms = fs === 'all' || (fs === 'active' ? u.accountStatus !== 'suspended' : u.accountStatus === 'suspended');
                const mr = fr === 'all' || u.role === fr;
                const msub = fsub === 'all' || u.subscriptionStatus === fsub;
                const created = u.createdAt ? new Date(u.createdAt) : null;
                const mFrom = !fFrom || (created && created >= new Date(fFrom));
                const mTo = !fTo || (created && created <= new Date(fTo + 'T23:59:59'));
                return mq && mp && ms && mr && msub && mFrom && mTo;
            });
            rows.sort((a, b) => {
                let av = a[sortField], bv = b[sortField];
                if (sortField === 'createdAt') {
                    av = av ? new Date(av).getTime() : 0;
                    bv = bv ? new Date(bv).getTime() : 0;
                } else {
                    av = (av || '').toString().toLowerCase();
                    bv = (bv || '').toString().toLowerCase();
                }
                if (av < bv) return sortDir === 'asc' ? -1 : 1;
                if (av > bv) return sortDir === 'asc' ? 1 : -1;
                return 0;
            });
            updateSortIndicators();
            renderStats(rows);
            const tb = document.getElementById('tbody');
            if (rows.length === 0) {
                tb.innerHTML = `<tr><td colspan="5" class="empty">Sin resultados</td></tr>`;
                return;
            }
            tb.innerHTML = rows.map(u => `
                <tr onclick="goToUser('${u.uid}')">
                    <td>
                        <div style="font-weight:600">${u.email || '(sin email)'}</div>
                        <div class="mono">${(u.uid||'').substring(0,16)}…</div>
                    </td>
                    <td>${planPill(u.plan)}</td>
                    <td>${statusPill(u.subscriptionStatus)}</td>
                    <td>${statusPill(u.accountStatus === 'suspended' ? 'suspended' : 'active')}</td>
                    <td class="muted" style="font-size:.8rem">${fmt(u.createdAt)}</td>
                </tr>
            `).join('');
        }

        async function loadUserDetail(uid) {
            try {
                const res = await cf('adminGetUserDetail')({ targetUid: uid });
                renderDetailPage(res.data);
            } catch (e) {
                document.getElementById('detailView').innerHTML = `<div class="empty">❌ ${e.message || e}</div>`;
            }
        }

        function fmtMoney(n) {
            return '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        async function renderBillingOverview() {
            const requestId = ++billingRequestId;
            try {
                const res = await cf('adminGetBillingOverview')();
                if (requestId !== billingRequestId) return;
                BILLING_DATA = res.data;
                document.getElementById('billingOverview').classList.remove('hidden');
                document.getElementById('billTotalRevenue').textContent = fmtMoney(BILLING_DATA.totalRevenue);
                document.getElementById('billMrr').textContent = fmtMoney(BILLING_DATA.mrr);
                document.getElementById('billThisMonth').textContent = fmtMoney(BILLING_DATA.thisMonthRevenue);
                document.getElementById('billFailed').textContent = BILLING_DATA.failedPaymentsCount;
                renderRevenueChart();
                renderPlanDistributionChart();
            } catch (e) {
                if (requestId !== billingRequestId) return;
                console.warn('[billing-overview]', e.message || e);
                document.getElementById('billingOverview').classList.add('hidden');
            }
        }

        function setBillingPeriod(period) {
            billingPeriod = period;
            document.getElementById('periodMonthBtn').classList.toggle('active', period === 'month');
            document.getElementById('periodYearBtn').classList.toggle('active', period === 'year');
            renderRevenueChart();
        }

        function renderRevenueChart() {
            if (!BILLING_DATA || typeof Chart === 'undefined') return;
            const rows = billingPeriod === 'month' ? BILLING_DATA.revenueByMonth : BILLING_DATA.revenueByYear;
            const labels = rows.map(r => r.month || r.year);
            const values = rows.map(r => r.total);
            const canvas = document.getElementById('revenueChart');
            if (revenueChart) {
                revenueChart.data.labels = labels;
                revenueChart.data.datasets[0].data = values;
                revenueChart.update();
                return;
            }
            revenueChart = new Chart(canvas, {
                type: 'line',
                data: {
                    labels,
                    datasets: [{ label: 'Ingresos', data: values, borderColor: '#8b5cf6', backgroundColor: 'rgba(139,92,246,.2)', tension: 0.3, fill: true }],
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#93a0c0' }, grid: { color: 'rgba(255,255,255,.06)' } },
                        y: { beginAtZero: true, ticks: { color: '#93a0c0', callback: v => '$' + v.toLocaleString() }, grid: { color: 'rgba(255,255,255,.06)' } },
                    },
                },
            });
        }

        function renderPlanDistributionChart() {
            if (typeof Chart === 'undefined') return;
            const canvas = document.getElementById('planChart');
            if (!canvas) return;
            const byPlan = { free: 0, starter: 0, professional: 0, premium: 0 };
            ALL_USERS.forEach(u => { if (byPlan[u.plan] !== undefined) byPlan[u.plan]++; });
            const labels = Object.keys(byPlan);
            const values = labels.map(k => byPlan[k]);
            const colors = labels.map(k => PLAN_CHART_COLORS[k]);
            if (planChart) {
                planChart.data.datasets[0].data = values;
                planChart.update();
                return;
            }
            planChart = new Chart(canvas, {
                type: 'doughnut',
                data: {
                    labels: labels.map(l => l.toUpperCase()),
                    datasets: [{ data: values, backgroundColor: colors, borderWidth: 0 }],
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { color: '#93a0c0', font: { size: 10 } } } },
                },
            });
        }

        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
            }[c]));
        }

        function renderDetailPage(d) {
            const p = d.profile;
            const stripeBase = 'https://dashboard.stripe.com/';
            const subs = (d.billing.subscriptions || []);
            const pays = (d.billing.payments || []);
            const recentLoads = (d.stats.recentLoads || []);

            const alerts = [];
            if (p.accountStatus === 'suspended') alerts.push('⛔ Cuenta suspendida');
            if (p.subscriptionStatus === 'canceled_scheduled') alerts.push('⏳ Suscripción cancela al fin del período actual');
            if (p.subscriptionStatus === 'canceled') alerts.push('🚫 Suscripción cancelada');

            const subsHtml = subs.length ? subs.map(s => `
                <div class="pay">
                    <div><b>Sub:</b> <span class="mono">${s.id}</span></div>
                    <div class="muted">Estado: ${s.status || '—'} · Plan: ${s.price?.id || s.items?.data?.[0]?.price?.id || '—'}</div>
                    <div class="muted">Período fin: ${fmt(s.current_period_end ? new Date(s.current_period_end*1000).toISOString() : null)}</div>
                </div>`).join('') : '<div class="muted">Sin suscripciones en Firestore.</div>';

            const paysHtml = pays.length ? pays.map(py => `
                <div class="pay">
                    <div><b>${py.currency ? py.currency.toUpperCase() : ''} ${(py.amount/100).toFixed(2)}</b> · ${py.status || ''}</div>
                    <div class="muted mono">${py.id}</div>
                    <div class="muted">${fmt(py.created ? new Date(py.created*1000).toISOString() : (py.created?.toDate?.()?.toISOString?.()))}</div>
                </div>`).join('') : '<div class="muted">Sin pagos registrados.</div>';

            const loadsRowsHtml = recentLoads.length ? recentLoads.map(l => `
                <tr>
                    <td>${fmt(l.date)}</td>
                    <td>${escapeHtml(l.origin)} → ${escapeHtml(l.destination)}</td>
                    <td>${fmtMoney(l.pay)}</td>
                    <td>${l.rpm ? l.rpm.toFixed(2) : '—'}</td>
                </tr>`).join('') : '<tr><td colspan="4" class="muted">Sin cargas registradas.</td></tr>';

            const dv = document.getElementById('detailView');
            dv.innerHTML = `
                <a class="back-link" onclick="backToList()">← Volver a la lista</a>

                <div class="detail-card">
                    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px">
                        <div>
                            <h2>${escapeHtml(p.fullName || p.email || '(sin nombre)')}</h2>
                            <div class="muted" style="margin-top:4px">${escapeHtml(p.email || '—')}${p.phone ? ' · ' + escapeHtml(p.phone) : ''}</div>
                            <div class="mono muted" style="margin-top:2px">${d.uid}</div>
                        </div>
                        <div style="display:flex;gap:8px;flex-wrap:wrap">
                            ${planPill(p.plan)} ${statusPill(p.subscriptionStatus)}
                            ${statusPill(p.accountStatus === 'suspended' ? 'suspended' : 'active')}
                        </div>
                    </div>

                    ${alerts.length ? `<div class="alert-line">${alerts.join(' · ')}</div>` : ''}

                    <div class="row-actions" style="margin-top:16px">
                        <select id="planSelect">
                            <option value="free">Free</option>
                            <option value="starter">Starter</option>
                            <option value="professional">Professional</option>
                            <option value="premium">Premium</option>
                        </select>
                        <input id="planReason" placeholder="Motivo del cambio (opcional)" style="flex:1;min-width:180px">
                        <button class="btn btn-primary" onclick="doSetPlan('${d.uid}')">Cambiar plan</button>
                        <button class="btn ${p.accountStatus==='suspended'?'btn-green':'btn-red'}" onclick="doToggleStatus('${d.uid}','${p.accountStatus==='suspended'?'suspended':'active'}')">
                            ${p.accountStatus==='suspended'?'✅ Reactivar cuenta':'⛔ Suspender cuenta'}
                        </button>
                        ${p.subscriptionId ? `<button class="btn btn-amber" onclick="doCancelSub('${d.uid}')">Cancelar suscripción</button>` : ''}
                    </div>
                </div>

                <div class="detail-card">
                    <h3>Resumen de negocio</h3>
                    <div class="kv">
                        <div class="k">Cliente desde</div><div>${fmt(p.createdAt)}</div>
                        <div class="k">Últ. actividad</div><div>${fmt(p.lastActiveAt)}</div>
                        <div class="k">Rol</div><div>${p.role}</div>
                        <div class="k">Ingresos totales (cargas)</div><div>${fmtMoney(d.stats.loadsTotal)}</div>
                    </div>
                </div>

                <div class="detail-card">
                    <h3>Facturación</h3>
                    <div class="kv">
                        <div class="k">Subscription ID</div><div class="mono">${escapeHtml(p.subscriptionId || '—')}</div>
                        <div class="k">Stripe Customer</div><div class="mono">${escapeHtml(d.billing.stripeCustomerId || p.stripeCustomerId || '—')}</div>
                        <div class="k">Total pagado (últ. ${d.billing.payments.length})</div><div>${fmtMoney(d.billing.totalPaid)}</div>
                    </div>
                    ${d.billing.failedPaymentsCount > 0 ? `<div class="alert-line">⚠️ ${d.billing.failedPaymentsCount} pago(s) sin estado "succeeded" — revisar en Stripe.</div>` : ''}
                    ${d.billing.stripeCustomerId ? `<a class="stripe-link small-note" target="_blank" href="${stripeBase}customers/${escapeHtml(d.billing.stripeCustomerId)}">Abrir en Stripe Dashboard →</a>` : ''}
                    <div class="section" style="margin-top:16px">
                        <h3>Suscripciones (Stripe)</h3>
                        ${subsHtml}
                    </div>
                    <div class="section">
                        <h3>Pagos recientes</h3>
                        ${paysHtml}
                    </div>
                </div>

                <div class="detail-card">
                    <h3>Configuración de la cuenta</h3>
                    <div class="kv">
                        <div class="k">Vehículo</div><div>${p.vehicle ? `${escapeHtml(p.vehicle.type || '—')} · ${escapeHtml(p.vehicle.mpg ?? '—')} MPG · $${escapeHtml(p.vehicle.fuelPrice ?? '—')}/gal` : '—'}</div>
                        <div class="k">CPM total</div><div>${p.costs?.totalCPM != null ? '$' + escapeHtml(p.costs.totalCPM) : '—'}</div>
                        <div class="k">Costos fijos/mes</div><div>${p.costs?.totalFixedMonthly != null ? fmtMoney(p.costs.totalFixedMonthly) : '—'}</div>
                        <div class="k">RPM mínimo</div><div>${p.preferences?.minRPM != null ? '$' + escapeHtml(p.preferences.minRPM) : '—'}</div>
                        <div class="k">RPM objetivo</div><div>${p.preferences?.targetRPM != null ? '$' + escapeHtml(p.preferences.targetRPM) : '—'}</div>
                        <div class="k">Deadhead máx.</div><div>${p.preferences?.maxDeadhead != null ? escapeHtml(p.preferences.maxDeadhead) + ' mi' : '—'}</div>
                    </div>
                </div>

                <div class="detail-card">
                    <h3>Actividad</h3>
                    <div class="kv">
                        <div class="k">Cargas totales</div><div>${d.stats.loadsCount}</div>
                        <div class="k">RPM promedio</div><div>${d.stats.loadsAvgRpm ? '$' + d.stats.loadsAvgRpm.toFixed(2) : '—'}</div>
                        <div class="k">Academia</div><div>${d.stats.academyModulesCompleted}/${d.stats.academyModulesTotal} módulos completados</div>
                    </div>
                    <table class="loads-table">
                        <thead><tr><th>Fecha</th><th>Ruta</th><th>Pago</th><th>RPM</th></tr></thead>
                        <tbody>${loadsRowsHtml}</tbody>
                    </table>
                </div>

                <div class="detail-card">
                    <h3>Notas de admin</h3>
                    <textarea id="adminNotes">${p.adminNotes || ''}</textarea>
                    <div class="row-actions">
                        <button class="btn btn-ghost" onclick="doSaveNotes('${d.uid}')">Guardar notas</button>
                    </div>
                </div>
            `;
            document.getElementById('planSelect').value = p.plan;
        }

        async function doSetPlan(uid) {
            const plan = document.getElementById('planSelect').value;
            const reason = document.getElementById('planReason').value;
            try {
                await cf('adminUpdateUser')({ targetUid: uid, operation: 'setPlan', plan, reason });
                showToast('✅ Plan actualizado a ' + plan, 'ok');
                await loadUserDetail(uid);
            } catch (e) { showToast('❌ ' + (e.message||e), 'err'); }
        }

        async function doToggleStatus(uid, current) {
            const status = current === 'suspended' ? 'active' : 'suspended';
            if (!confirm('¿' + (status==='suspended'?'Suspender':'Reactivar') + ' esta cuenta?')) return;
            try {
                await cf('adminUpdateUser')({ targetUid: uid, operation: 'setAccountStatus', status });
                showToast('✅ Cuenta ' + status, 'ok');
                await loadUserDetail(uid);
            } catch (e) { showToast('❌ ' + (e.message||e), 'err'); }
        }

        async function doCancelSub(uid) {
            if (!confirm('¿Cancelar la suscripción al final del periodo actual?')) return;
            try {
                await cf('adminUpdateUser')({ targetUid: uid, operation: 'cancelSubscription', atPeriodEnd: true });
                showToast('✅ Suscripción cancelada (fin de periodo)', 'ok');
                await loadUserDetail(uid);
            } catch (e) { showToast('❌ ' + (e.message||e), 'err'); }
        }

        async function doSaveNotes(uid) {
            const notes = document.getElementById('adminNotes').value;
            try {
                await cf('adminUpdateUser')({ targetUid: uid, operation: 'saveNotes', notes });
                showToast('✅ Notas guardadas', 'ok');
            } catch (e) { showToast('❌ ' + (e.message||e), 'err'); }
        }

        function logout() {
            if (MOCK_MODE) { showToast('Modo mock: no hay sesión real que cerrar', 'err'); return; }
            auth.signOut().then(() => { window.location.href = './auth.html'; });
        }
    </script>
</body>

</html>
