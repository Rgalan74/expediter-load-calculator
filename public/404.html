<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Página no encontrada | Smart Load Solution</title>
  <link rel="icon" type="image/png" href="/img/logo-app.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=optional" rel="stylesheet">
  <style>
    :root { --bg: #0a0a0f; --card: #14141c; --text: #f1f5f9; --muted: #94a3b8; --cyan: #00D9FF; --orange: #22D3EE; --line: rgba(255,255,255,0.08); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
      font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text);
      background-image: radial-gradient(circle at 20% 10%, rgba(0,217,255,0.08), transparent 40%), radial-gradient(circle at 80% 90%, rgba(34,211,238,0.08), transparent 40%); }
    .card { width: 100%; max-width: 480px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 40px 32px; text-align: center; }
    .logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); font-weight: 800; margin-bottom: 28px; }
    .logo img { width: 40px; height: 40px; border-radius: 50%; }
    .code { font-size: 72px; font-weight: 800; line-height: 1; background: linear-gradient(90deg, #22D3EE 0%, #A5F3FC 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h1 { font-size: 22px; margin: 16px 0 8px; }
    p { color: var(--muted); font-size: 15px; line-height: 1.6; }
    .en { margin-top: 4px; font-size: 13px; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 28px; }
    .btn { display: inline-block; padding: 12px 22px; border-radius: 12px; font-weight: 600; font-size: 15px; text-decoration: none; }
    .btn-primary { background: var(--orange); color: #06101c; }
    .btn-ghost { border: 1px solid var(--line); color: var(--text); }
    .btn:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
  <main class="card">
    <a class="logo" href="/"><img src="/img/logo-app.webp" alt="" width="40" height="40">Smart Load Solution</a>
    <div class="code">404</div>
    <h1>Esta página no existe</h1>
    <p>Puede que el enlace esté mal escrito o que la página se haya movido.</p>
    <p class="en">This page doesn't exist. The link may be wrong or the page may have moved.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Ir al inicio · Home</a>
      <a class="btn btn-ghost" href="/app.html">Abrir la app · Open app</a>
    </div>
  </main>
</body>
</html>
