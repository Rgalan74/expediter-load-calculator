<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Purchase flow test harness — not deployed</title></head>
<body>
<script>
  // ── Stubs, definidos ANTES de cargar el codigo real ──────────────────────
  window.__callLog = [];

  window.debugLog = function (...args) { window.__callLog.push(['debugLog', args]); };
  window.showToast = function () {};
  var _urlParams = new URLSearchParams(window.location.search);
  // Simula un gtag.js real: registra la llamada y, salvo que la URL pida
  // lo contrario (?skip_callback=1, para probar el respaldo por timeout),
  // dispara event_callback de forma asincronica -- como haria gtag.js de
  // verdad al confirmar (o fallar) el envio del hit.
  var _skipCallback = _urlParams.get('skip_callback') === '1';
  window.gtag = function (...args) {
    window.__callLog.push(['gtag', args]);
    var params = args[2];
    if (!_skipCallback && params && typeof params.event_callback === 'function') {
      setTimeout(params.event_callback, 50);
    }
  };
  window.PLANS = {
    free: { id: 'free', name: 'Starter', price: 0 },
    professional: { id: 'professional', name: 'Professional', price: 14.99 },
    premium: { id: 'premium', name: 'Premium + AI', price: 29.99 },
  };
  // getUserPlan() simulado: por defecto devuelve el plan pagado de siempre
  // (professional), pero el harness permite forzar otra respuesta via
  // ?user_plan=... para probar el guard del fallback -- ej. "free" simula
  // que el webhook de Stripe todavia no actualizo Firestore.
  var _userPlanOverride = _urlParams.get('user_plan');
  window.getUserPlan = async function (uid) {
    window.__callLog.push(['getUserPlan', [uid]]);
    if (_userPlanOverride === 'none') return null;
    var planId = _userPlanOverride || 'professional';
    return window.PLANS[planId] || null;
  };
  // __reloadPage se define ANTES de que stripe-config.js cargue, por eso
  // stripe-config.js usa "window.__reloadPage || (() => ...)" -- respeta
  // este stub en vez de pisarlo.
  // Se registra performance.now() aqui (no Date.now() del lado de Playwright
  // antes del page.goto()) para que el test mida solo la duracion real del
  // await gtag/timeout dentro de handleCheckoutResult(), sin incluir el
  // tiempo de carga/navegacion de la pagina, que es ruido para este assert.
  window.__reloadPage = function () {
    window.__reloadTime = performance.now();
    window.__callLog.push(['__reloadPage', []]);
  };

  // Firebase stub minimo -- solo lo que handleCheckoutResult() toca.
  var _authUser = { uid: 'test-uid-123' };
  window.firebase = {
    auth: function () {
      return {
        currentUser: _authUser,
        onAuthStateChanged: function (cb) {
          setTimeout(function () { cb(_authUser); }, 0);
          return function unsubscribe() {};
        },
      };
    },
  };

  // Simular que ya paso por checkout y volvio de Stripe. El plan pendiente
  // en sessionStorage es configurable via ?pending_plan=... -- por defecto
  // "professional" (camino feliz normal, compatible con los tests previos).
  // ?pending_plan=__none__ simula sessionStorage perdido (cae directo al
  // fallback, igual que el Step 4 original de este harness).
  var _pendingPlan = _urlParams.has('pending_plan') ? _urlParams.get('pending_plan') : 'professional';
  if (_pendingPlan === '__none__') {
    sessionStorage.removeItem('pendingCheckoutPlan');
  } else {
    sessionStorage.setItem('pendingCheckoutPlan', _pendingPlan);
  }
</script>
<script src="/js/purchase-tracking.js"></script>
<script src="/js/stripe-config.js"></script>
<script>
  // handleCheckoutResult() normalmente se dispara solo si el pathname
  // incluye "app.html" (ver stripe-config.js, bloque de inicializacion).
  // Este harness no es app.html, asi que lo llamamos directo -- probamos
  // la funcion, no el gate del pathname (eso no es parte de este bug).
  window.__startTime = performance.now();
  window.__testDone = handleCheckoutResult();
</script>
</body>
</html>
